name: Docker i18n

# Fork-only pipeline: builds the server and agent images (linux/amd64) plus
# server+agent binaries. Triggered by pushing a v*-i18n tag (e.g.
# v0.11.1-i18n) or manually. Images go to GHCR as arkeep-server /
# arkeep-agent, binaries are workflow artifacts. Upstream workflows are
# disabled in the fork settings, not by deleting their files.
on:
  push:
    tags: ["v*-i18n"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  server-image:
    name: Build server image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # The GUI renders "v${server_version}": inject the version without
          # the leading v, like GoReleaser's {{.Version}} does upstream.
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          # Single-arch manifest without attestation layers: plain docker pull.
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}-server:latest
            ghcr.io/${{ github.repository }}-server:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-server:sha-${{ steps.meta.outputs.short_sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

  agent-image:
    name: Build agent image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # The GUI renders "v${server_version}": inject the version without
          # the leading v, like GoReleaser's {{.Version}} does upstream.
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}-agent:latest
            ghcr.io/${{ github.repository }}-agent:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-agent:sha-${{ steps.meta.outputs.short_sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          # Authenticates the restic/rclone download against the GitHub API
          # (secret mount, never stored in a layer).
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max

  binaries:
    name: Build binaries
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            server/go.sum
            agent/go.sum

      # pnpm/action-setup must run before setup-node so its pnpm cache
      # lookup can find the binary (same ordering as upstream release.yml).
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: gui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Build GUI and embed into server
        run: |
          set -euo pipefail
          cd gui
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p ../server/cmd/server/dist
          cp -r dist/. ../server/cmd/server/dist/

      # Without --all-platforms the script downloads restic/rclone for the
      # host platform only (linux/amd64 on this runner), matching the build.
      - name: Download agent dependencies
        working-directory: agent
        run: go run ./scripts/download_deps.go

      - name: Build server and agent
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${BUILD_DATE}"
          mkdir -p out
          (cd server && CGO_ENABLED=0 GOWORK=off GOOS=linux GOARCH=amd64 \
            go build -ldflags="$LDFLAGS" -o ../out/arkeep-server ./cmd/server)
          (cd agent && CGO_ENABLED=0 GOWORK=off GOOS=linux GOARCH=amd64 \
            go build -ldflags="$LDFLAGS" -o ../out/arkeep-agent ./cmd/agent)

      # Same archive layout as upstream releases: binary + LICENSE + README
      # + systemd unit.
      - name: Package
        run: |
          set -euo pipefail
          for name in server agent; do
            stage="stage-${name}"
            mkdir -p "$stage"
            cp "out/arkeep-${name}" "$stage/"
            cp LICENSE README.md "deploy/systemd/arkeep-${name}.service" "$stage/"
            tar czf "arkeep-${name}_linux_amd64.tar.gz" -C "$stage" .
          done
          sha256sum arkeep-*_linux_amd64.tar.gz > checksums.txt

      - name: Upload binaries
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: arkeep-binaries
          path: |
            arkeep-server_linux_amd64.tar.gz
            arkeep-agent_linux_amd64.tar.gz
            checksums.txt
          if-no-files-found: error